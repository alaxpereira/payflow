# Apenas para desenvolvimento local: estas credenciais não são segredos.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      # Cria o banco do processor na primeira inicialização. Cada serviço tem o seu banco.
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # Roda direto como o usuário do RabbitMQ. Sem isso, no Docker Desktop (Windows) o .erlang.cookie pode ser
    # criado como root no volume e o broker não consegue lê-lo (erro eacces na inicialização).
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: payflow
      RABBITMQ_DEFAULT_PASS: payflow
    ports:
      - "5672:5672"
      - "15672:15672" # painel de gerenciamento: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  ledger-api:
    build: ./services/ledger
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Ledger: Host=postgres;Database=ledger;Username=payflow;Password=payflow
      Database__MigrateOnStartup: "true"
      RabbitMq__Uri: amqp://payflow:payflow@rabbitmq:5672
      Outbox__Relay__Enabled: "true"
      Telemetry__TracesEndpoint: http://jaeger:4318/v1/traces
      Telemetry__MetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  processor:
    build: ./services/processor
    environment:
      PROCESSOR_DATABASE_URL: postgres://payflow:payflow@postgres:5432/processor?sslmode=disable
      PROCESSOR_RABBITMQ_URL: amqp://payflow:payflow@rabbitmq:5672
      PROCESSOR_HTTP_ADDR: ":8081"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp/v1/metrics
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # --- Observabilidade ---------------------------------------------------------------------------

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686" # interface: http://localhost:16686
      - "4318:4318" # OTLP/HTTP, para rodar os serviços fora do Docker

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: payflow
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payflow.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000" # dashboards: http://localhost:3000
    depends_on:
      - prometheus
      - jaeger
