name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Subir a stack
        run: docker compose up -d --build

      - name: Teste ponta a ponta
        run: bash scripts/e2e.sh

      - name: Logs dos serviços
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v
